<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>辩证思考顾问</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app">
        <!-- 左侧历史记录面板 -->
        <aside class="history-sidebar" id="historySidebar">
            <div class="sidebar-header">
                <h2>历史记录</h2>
                <button class="btn-icon sidebar-close" id="sidebarClose" title="关闭">&#x2715;</button>
            </div>
            <div class="sidebar-list" id="historyList">
                <div class="history-empty">暂无历史记录</div>
            </div>
            <button class="btn-new-chat" id="newChatBtn">+ 新对话</button>
        </aside>

        <!-- 主内容区 -->
        <div class="main-area" id="mainArea">
            <!-- 顶部导航 -->
            <header class="header">
                <button class="btn-icon menu-btn" id="menuBtn" title="历史记录">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <h1>辩证思考顾问</h1>
                <p class="subtitle">多视角 · 哲学推理 · 智慧对话</p>
                <div class="save-menu-wrapper">
                    <button class="btn-screenshot" id="screenshotBtn" title="保存对话记录">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="13" r="4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>保存</span>
                        <svg class="dropdown-arrow" viewBox="0 0 24 24" width="12" height="12">
                            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="save-dropdown" id="saveDropdown">
                        <button class="save-option" data-action="screenshot">
                            <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                            截图保存
                        </button>
                        <button class="save-option" data-action="html">
                            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="2"/><line x1="16" y1="17" x2="8" y2="17" stroke="currentColor" stroke-width="2"/></svg>
                            导出HTML
                        </button>
                        <button class="save-option" data-action="markdown">
                            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                            导出Markdown
                        </button>
                        <button class="save-option" data-action="print">
                            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                            打印/PDF
                        </button>
                    </div>
                </div>
            </header>

        <!-- 视角选择面板 -->
        <div class="skills-panel" id="skillsPanel">
            <div class="skills-header">
                <span>本次思考视角</span>
                <button class="btn-icon" id="toggleSkills">&#x2715;</button>
            </div>
            <div class="skills-list" id="skillsList"></div>
            <div class="confidence-bar">
                <span>置信度</span>
                <div class="bar">
                    <div class="fill" id="confidenceFill"></div>
                </div>
                <span id="confidenceText">0%</span>
            </div>
        </div>

        <!-- 对话区域 -->
        <main class="chat-container">
            <div class="messages" id="messages">
                <!-- 欢迎消息 -->
                <div class="message welcome">
                    <div class="avatar bot">
                        <svg viewBox="0 0 24 24" width="32" height="32">
                            <circle cx="12" cy="12" r="10" fill="#4A90D9"/>
                            <path d="M8 10h8M8 14h5" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="content">
                        <p>你好，我是<strong>辩证思考顾问</strong>。</p>
                        <p>我可以帮你从儒、道、佛、法、墨等中国传统哲学视角，深入分析你的人生困惑、处世难题或决策纠结。</p>
                        <p class="example">试试问我：<em>"创业还是打工，怎么选？"</em></p>
                    </div>
                </div>
            </div>
        </main>

        <!-- 底部输入区 -->
        <footer class="input-area">
            <div class="input-wrapper">
                <textarea
                    id="userInput"
                    placeholder="输入你的问题..."
                    rows="1"
                ></textarea>
                <button class="btn-search-toggle active" id="searchToggle" title="联网搜索">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
                        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="btn-send" id="sendBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" fill="currentColor"/>
                    </svg>
                </button>
                <button class="btn-stop" id="stopBtn" style="display:none;" title="停止生成">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
                    </svg>
                </button>
            </div>
            <div class="quick-questions">
                <button class="quick-btn">人生抉择</button>
                <button class="quick-btn">人际处世</button>
                <button class="quick-btn">事业发展</button>
            </div>
        </footer>

        <!-- 加载动画 -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-content">
                <div class="thinking-dots">
                    <span></span><span></span><span></span>
                </div>
                <p id="loadingText">思考中...</p>
            </div>
        </div>
        </div><!-- end main-area -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
