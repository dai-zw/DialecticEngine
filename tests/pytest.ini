[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记定义
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    smoke: Smoke tests (quick sanity checks)
    skill: Skill-specific tests
    router: Router pipeline tests
    context: Context management tests
    feedback: Feedback learning tests
    edge: Edge case tests

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 覆盖率选项 (需要 pytest-cov)
# addopts = --cov=policy_router --cov-report=html --cov-report=term
